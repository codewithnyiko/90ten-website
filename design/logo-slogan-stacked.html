<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>90Ten Group - logo with stacked slogan (template)</title>
<!--
  TEMPLATE: logo on the left, slogan stacked one word per line on the right.
  Approved design. Open this file in a browser to preview all sizes.

  To use on the site: copy the CSS block and the .lockup markup into wwwroot.
  Everything scales from one variable: --s = logo width.

  Sizes:
    small phone (320px)  --s: 64px
    phone       (390px)  --s: 84px
    tablet      (768px)  --s: 130px
    desktop     (1280px) --s: 190px
-->
<style>
  :root{--card:#2d2d30;--accent:#ff4d4d}
  body{font-family:"Jost",system-ui,sans-serif;background:#f4f4f5;margin:0;padding:24px 16px}
  h1{font-size:1.3rem;margin:0 0 1.5rem}
  .row{display:flex;flex-wrap:wrap;gap:28px 24px;align-items:flex-end}
  small{display:block;color:#6b6b72;margin-bottom:.5rem}

  /* ---- COPY FROM HERE ---- */
  .lockup{
    --s:130px;                       /* logo width: the only number to change */
    display:flex;align-items:center;justify-content:center;
    gap:calc(var(--s)*.14);padding:calc(var(--s)*.2);
    background:var(--card);border-radius:calc(var(--s)*.18);box-sizing:border-box;
  }
  .lockup .logo{width:var(--s);aspect-ratio:1.137;flex:none;
    background:url(../wwwroot/img/logo-dark.png) center/contain no-repeat}
  .lockup .rule{width:2px;align-self:stretch;background:rgba(255,255,255,.25);flex:none}
  .lockup .slogan{display:flex;flex-direction:column;gap:calc(var(--s)*.06);
    color:#fff;font-weight:500;letter-spacing:.03em;font-size:calc(var(--s)*.17);
    line-height:1.15;white-space:nowrap}
  .lockup .slogan b{color:var(--accent);font-weight:700}
  .lockup.sm{--s:64px}.lockup.md{--s:84px}.lockup.lg{--s:130px}.lockup.xl{--s:190px}
  /* ---- COPY TO HERE ---- */
</style>
</head>
<body>
<h1>Logo with stacked slogan</h1>
<div class="row">
  <div><small>Small phone, 64px</small>
    <div class="lockup sm"><div class="logo" role="img" aria-label="90Ten Group"></div><div class="rule"></div>
      <div class="slogan"><span><b>T</b>ailored.</span><span><b>E</b>ngineered.</span><span><b>N</b>urtured.</span></div></div></div>
  <div><small>Phone, 84px</small>
    <div class="lockup md"><div class="logo" role="img" aria-label="90Ten Group"></div><div class="rule"></div>
      <div class="slogan"><span><b>T</b>ailored.</span><span><b>E</b>ngineered.</span><span><b>N</b>urtured.</span></div></div></div>
  <div><small>Tablet, 130px</small>
    <div class="lockup lg"><div class="logo" role="img" aria-label="90Ten Group"></div><div class="rule"></div>
      <div class="slogan"><span><b>T</b>ailored.</span><span><b>E</b>ngineered.</span><span><b>N</b>urtured.</span></div></div></div>
  <div><small>Desktop, 190px</small>
    <div class="lockup xl"><div class="logo" role="img" aria-label="90Ten Group"></div><div class="rule"></div>
      <div class="slogan"><span><b>T</b>ailored.</span><span><b>E</b>ngineered.</span><span><b>N</b>urtured.</span></div></div></div>
</div>
</body>
</html>
